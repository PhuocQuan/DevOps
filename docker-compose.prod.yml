version: '3.8'

services:
  front-app:
    # Lưu ý: docker-compose trên server sẽ TẢI image từ Docker Hub về, 
    # chứ không build từ Dockerfile nữa (Jenkins đã lo việc build)
    image: docker.io/quan109/front_dep:latest
    container_name: front-app
    ports:
      - "80:80"     # Cổng cho React Web (Nginx)
      - "2300:2300" # Cổng cho json-server (Backend giả lập)
    restart: always
